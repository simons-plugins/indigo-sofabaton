name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # tests/conftest.py stubs the `indigo` module, and the
          # plugin guards its paho-mqtt / zeroconf imports behind
          # try/except or lazy imports, so no plugin runtime deps
          # need to be installed for the test suite to run.
          # Versions pinned for reproducible CI.
          pip install 'pytest==8.3.3' 'pytest-mock==3.14.0'

      - name: Run pytest
        run: pytest tests/ -q
